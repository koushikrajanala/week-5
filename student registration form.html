    <h2>Login</h2> 
    <form action="#" method="post"> 
        <label>Username:</label><br> 
        <input type="text" 
               name="username" 
               required> 
        <br><br>

               name="password"

    <h2>Student Registration Form</h2> 
    <form action="#" method="post"> 
        <label>Full Name:</label><br> 
        <input type="text" name="name" required> 
        <br><br> 
        <label>Email:</label><br> 
        <input type="email" name="email" required> 
        <br><br> 
        <label>Password:</label><br> 
        <input type="password" name="pwd" required> 
        <br><br> 
        <label>Gender:</label> 
        <input type="radio" 
               name="gender" 
               value="M"> 
        Male 
        <input type="radio" 
               name="gender" 
               value="F"> 
        Female 
        <br><br> 
        <label>Courses:</label> 
        <input type="checkbox" 
               name="course" 
               value="web"> 
        Web Tech 
        <input type="checkbox" 
               name="course" 
               value="dbms"> 
        DBMS 
        <br><br> 
        <label>Date of Birth:</label> 
        <input type="date" 
               name="dob"> 
        <br><br> 
        <label>Country:</label> 
        <select name="country"> 
            <option>India</option> 
            <option>USA</option> 
            <option>UK</option> 
        </select> 
        <br><br> 
        <input type="submit" 
               value="Register"> 
        <input type="reset" 
               value="Clear"> 
    </form> 
</body> 
</html>

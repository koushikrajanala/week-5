     <!DOCTYPE html> 
<html>

<body>

    <h2>Login</h2> 
    <form action="#" method="post"> 
        <label>Username:</label><br> 
        <input type="text" 
               name="username" 
               required> 
        <br><br> 
        <label>Password:</label><br> 
        <input type="password" 
               name="password" 
               required> 
        <br><br> 
        <input type="submit" 
               value="Login"> 
    </form> 
</body> 
</html> 
 
    <h2>Feedback Form</h2> 
    <form action="#" method="post"> 
        <label>Name:</label><br> 
        <input type="text" 
               name="name"> 
        <br><br> 
        <label>Rate our service:</label> 
        <select name="rating"> 
            <option>Excellent</option> 
            <option>Good</option> 
            <option>Average</option> 
            <option>Poor</option> 
        </select> 
        <br><br> 
        <label>Comments:</label><br> 
        <textarea name="comments" 
                  rows="4" 
                  cols="40"></textarea> 
        <br><br> 
        <input type="submit" 
               value="Submit Feedback"> 
    </form> 
</body> 
</html>
